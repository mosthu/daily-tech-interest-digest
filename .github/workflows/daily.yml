name: 每日科技兴趣简报

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 北京时间 09:00

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖和中文字体
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: 生成中文简报、竖版长图并推送 ClawBot
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_CLAWBOT_TOKEN: ${{ secrets.PUSHPLUS_CLAWBOT_TOKEN }}
        run: python tech_digest.py
      - name: 保存本次简报产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-digest
          path: output/
          if-no-files-found: warn
          retention-days: 7
