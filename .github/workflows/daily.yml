name: 每日科技兴趣简报

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 北京时间 09:00

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖和中文字体
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: 生成中文简报和竖版长图
        run: python tech_digest.py --generate-only
      - name: 发布长图到独立资源分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: digest-assets
          publish_dir: ./output
          force_orphan: true
      - name: 推送到 PushPlus ClawBot
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_CLAWBOT_TOKEN: ${{ secrets.PUSHPLUS_CLAWBOT_TOKEN }}
          PUBLIC_IMAGE_URL: https://raw.githubusercontent.com/mosthu/daily-tech-interest-digest/digest-assets/tech-digest.png?v=${{ github.run_id }}
        run: python tech_digest.py --send-existing
      - name: 保存本次简报产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-digest
          path: output/
          if-no-files-found: warn
          retention-days: 7
