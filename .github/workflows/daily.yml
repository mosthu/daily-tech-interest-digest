name: NVIDIA 和 AMD 消费级显卡每日价格报告

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai. GitHub may delay scheduled jobs briefly.
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集价格、翻译新闻并推送微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python monitor.py

      - name: 保存价格历史
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.json
          git diff --cached --quiet || git commit -m "chore: update RX 9070 XT price history"
          git push
